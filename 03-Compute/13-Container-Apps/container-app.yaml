name: nginx-app
type: Microsoft.App/containerApps
properties:
  configuration:
    ingress:
      external: true
      targetPort: 80
    registries:
      - server: myacrxyz123.azurecr.io
        username: myacrxyz123
        passwordSecretRef: ""
    secrets: []
  template:
    containers:
      - image: myacrxyz123.azurecr.io/nginx:v1
        name: nginx-app
    scale:
      minReplicas: 0
      maxReplicas: 5
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "10"